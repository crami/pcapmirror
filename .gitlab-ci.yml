# The package version comes from debian/changelog. Packages are built and
# published only for tags, which must match it (v0.6 or 0.6), as must the
# Version in pcapmirror.spec. Each build gets its own package version
# (0.6-1+deb13, +testing, +unstable, ...), so that the builds for the
# different suites can live in one apt repository.
#
# The packages are collected in dist/<dist>/ and uploaded to the generic
# package registry (pcapmirror/<dist>/). The Debian bookworm, trixie, testing
# and unstable packages (amd64, and arm64 where there is one: the PiOS
# bookworm build) also go to the apt repository.
#
# The release job creates a GitLab release for the tag that links the
# packages in the generic package registry. Each link has a filepath without
# the version, so .../-/releases/permalink/latest/downloads/<filepath> always
# gives the package of the newest release (used by website/).
#
# publish-deb needs these CI/CD variables: APT_HOST (the repository server),
# APT_KNOWN_HOSTS (its host key line) and APT_DEPLOY_KEY (private key of the
# "repo" user, whose authorized_keys runs reprepro for the given suite).

stages:
  - version
  - build
  - publish
  - release

default:
  tags:
    - docker-generic

variables:
  DEBIAN_FRONTEND: noninteractive

# Passes VERSION (upstream, 0.6) and DEBVERSION (0.6-1) to the other jobs.
version:
  stage: version
  image: debian:trixie-slim
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends dpkg-dev
    - DEBVERSION=$(dpkg-parsechangelog -S Version)
    - VERSION=$(echo "$DEBVERSION" | sed -e 's/^[0-9]*://' -e 's/-[^-]*$//')
    - |
      if [ "${CI_COMMIT_TAG#v}" != "$VERSION" ]; then
        echo "Tag $CI_COMMIT_TAG does not match debian/changelog version $DEBVERSION" >&2
        exit 1
      fi
      SPECVERSION=$(sed -n 's/^Version:[[:space:]]*//p' pcapmirror.spec)
      if [ "$SPECVERSION" != "$VERSION" ]; then
        echo "pcapmirror.spec version $SPECVERSION does not match $VERSION" >&2
        exit 1
      fi
    - echo "VERSION=$VERSION" > build.env
    - echo "DEBVERSION=$DEBVERSION" >> build.env
  artifacts:
    reports:
      dotenv: build.env

deb:
  stage: build
  image: $IMAGE
  parallel:
    matrix:
      - { DIST: bookworm, IMAGE: "debian:bookworm", ARCH: amd64, SUFFIX: deb12 }
      - { DIST: trixie, IMAGE: "debian:trixie", ARCH: amd64, SUFFIX: deb13 }
      - { DIST: testing, IMAGE: "debian:testing", ARCH: amd64, SUFFIX: testing }
      - { DIST: unstable, IMAGE: "debian:unstable", ARCH: amd64, SUFFIX: unstable }
      - { DIST: bookworm, IMAGE: "pios-package-builder-bookworm:v1", ARCH: armhf, SUFFIX: pios12 }
      - { DIST: bookworm, IMAGE: "pios-package-builder-bookworm:64-v1", ARCH: arm64, SUFFIX: pios12 }
      - { DIST: plucky, IMAGE: "ubuntu-package-builder-plucky:v1", ARCH: amd64, SUFFIX: ubu25.04 }
      - { DIST: noble, IMAGE: "ubuntu-package-builder-noble:v1", ARCH: amd64, SUFFIX: ubu24.04 }
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - version
  script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends build-essential debhelper libpcap-dev
    - tar -czf ../pcapmirror_$VERSION.orig.tar.gz --exclude=debian --exclude=.git .
    - sed -i "1s/(\([^)]*\))/(\1+$SUFFIX)/" debian/changelog
    - dpkg-parsechangelog -S Version
    # -i -I: leave .git (not in the orig tarball) out of the source package
    - dpkg-buildpackage -uc -us -i -I
    - mkdir -p dist/$DIST
    - cp ../pcapmirror_$DEBVERSION+${SUFFIX}_$ARCH.deb dist/$DIST/pcapmirror_$VERSION-${SUFFIX}_$ARCH.deb
  artifacts:
    paths:
      - dist/

rpm:
  stage: build
  image: rockylinux-package-builder-$EL:v1
  parallel:
    matrix:
      - EL: ["8", "9", "10"]
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - version
  script:
    - dnf install -y libpcap-devel
    - mkdir -p /root/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
    - tar -czf /root/rpmbuild/SOURCES/pcapmirror-v${VERSION}.tar.gz --exclude=debian --exclude=.git .
    - cp -r * /root/rpmbuild/BUILD
    - rpmbuild -ba pcapmirror.spec
    - mkdir -p dist/rockylinux$EL
    - cp /root/rpmbuild/RPMS/x86_64/pcapmirror-$VERSION-*.el$EL.x86_64.rpm dist/rockylinux$EL/pcapmirror-$VERSION-1.el$EL.x86_64.rpm
  artifacts:
    paths:
      - dist/

publish-generic:
  stage: publish
  image: debian:trixie-slim
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: deb
      artifacts: true
    - job: rpm
      artifacts: true
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates
    - ls -R dist
    - |
      for f in dist/*/*; do
        dist=$(basename "$(dirname "$f")")
        echo "$f -> $dist"
        curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/pcapmirror/$dist/$(basename "$f")"
      done

publish-deb:
  stage: publish
  image: debian:trixie-slim
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: deb
      artifacts: true
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends openssh-client
    - mkdir -p ~/.ssh && echo "$APT_KNOWN_HOSTS" > ~/.ssh/known_hosts
    # APT_DEPLOY_KEY may be a variable or a file variable (then it is a path),
    # with the key as is or base64 encoded (base64 -w0, so it can be masked).
    - |
      key="$APT_DEPLOY_KEY"
      [ -f "$key" ] && key=$(cat "$key")
      case $key in
        -----BEGIN*) ;;
        *) key=$(printf '%s' "$key" | base64 -d) ;;
      esac
      if [ -z "$key" ]; then
        echo "APT_DEPLOY_KEY is empty: not set, or protected and $CI_COMMIT_REF_NAME is not a protected tag" >&2
        exit 1
      fi
      eval "$(ssh-agent -s)"
      printf '%s\n' "$key" | tr -d '\r' | ssh-add -
    # The packages are in dist/<suite>/; each goes to the distribution of
    # the same name in the repository. The amd64 and arm64 ones: dist/bookworm/
    # also has the PiOS packages, of which the arm64 one goes to bookworm too.
    - |
      for suite in bookworm trixie testing unstable; do
        set -- dist/$suite/pcapmirror_*_amd64.deb
        [ -f "$1" ] || { echo "no package for $suite" >&2; exit 1; }
        for f in dist/$suite/pcapmirror_*_amd64.deb dist/$suite/pcapmirror_*_arm64.deb; do
          [ -f "$f" ] || continue
          echo "$f -> $suite"
          ssh "repo@$APT_HOST" "$suite" < "$f"
        done
      done

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - version
    - publish-generic
  script:
    - echo "Release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: pcapmirror $VERSION
    description: "pcapmirror $VERSION for Debian, Ubuntu and Rocky Linux."
    assets:
      links:
        - name: pcapmirror_${VERSION}-deb12_amd64.deb (Debian 12 (bookworm))
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/pcapmirror/bookworm/pcapmirror_${VERSION}-deb12_amd64.deb
          filepath: /pcapmirror-debian12_amd64.deb
          link_type: package
        - name: pcapmirror_${VERSION}-deb13_amd64.deb (Debian 13 (trixie))
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/pcapmirror/trixie/pcapmirror_${VERSION}-deb13_amd64.deb
          filepath: /pcapmirror-debian13_amd64.deb
          link_type: package
        - name: pcapmirror_${VERSION}-testing_amd64.deb (Debian testing)
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/pcapmirror/testing/pcapmirror_${VERSION}-testing_amd64.deb
          filepath: /pcapmirror-debian-testing_amd64.deb
          link_type: package
        - name: pcapmirror_${VERSION}-unstable_amd64.deb (Debian unstable)
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/pcapmirror/unstable/pcapmirror_${VERSION}-unstable_amd64.deb
          filepath: /pcapmirror-debian-unstable_amd64.deb
          link_type: package
        - name: pcapmirror_${VERSION}-pios12_armhf.deb (PiOS 12 armhf)
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/pcapmirror/bookworm/pcapmirror_${VERSION}-pios12_armhf.deb
          filepath: /pcapmirror-pios12_armhf.deb
          link_type: package
        - name: pcapmirror_${VERSION}-pios12_arm64.deb (PiOS 12 arm64)
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/pcapmirror/bookworm/pcapmirror_${VERSION}-pios12_arm64.deb
          filepath: /pcapmirror-pios12_arm64.deb
          link_type: package
        - name: pcapmirror_${VERSION}-ubu24.04_amd64.deb (Ubuntu 24.04 (noble))
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/pcapmirror/noble/pcapmirror_${VERSION}-ubu24.04_amd64.deb
          filepath: /pcapmirror-ubuntu24.04_amd64.deb
          link_type: package
        - name: pcapmirror_${VERSION}-ubu25.04_amd64.deb (Ubuntu 25.04 (plucky))
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/pcapmirror/plucky/pcapmirror_${VERSION}-ubu25.04_amd64.deb
          filepath: /pcapmirror-ubuntu25.04_amd64.deb
          link_type: package
        - name: pcapmirror-${VERSION}-1.el8.x86_64.rpm (Rocky Linux 8)
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/pcapmirror/rockylinux8/pcapmirror-${VERSION}-1.el8.x86_64.rpm
          filepath: /pcapmirror-rockylinux8.x86_64.rpm
          link_type: package
        - name: pcapmirror-${VERSION}-1.el9.x86_64.rpm (Rocky Linux 9)
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/pcapmirror/rockylinux9/pcapmirror-${VERSION}-1.el9.x86_64.rpm
          filepath: /pcapmirror-rockylinux9.x86_64.rpm
          link_type: package
        - name: pcapmirror-${VERSION}-1.el10.x86_64.rpm (Rocky Linux 10)
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/pcapmirror/rockylinux10/pcapmirror-${VERSION}-1.el10.x86_64.rpm
          filepath: /pcapmirror-rockylinux10.x86_64.rpm
          link_type: package
